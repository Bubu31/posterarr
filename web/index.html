<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>posterarr</title>
  <style>
    :root { color-scheme: light dark; --bg: #0e0f13; --card: #1a1c22; --fg: #e8e8ea; --muted: #8a8d97; --accent: #6279cd; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid #2a2d36; display: flex; gap: 1rem; align-items: baseline; position: sticky; top: 0; background: var(--bg); z-index: 10; }
    header h1 { margin: 0; font-size: 1.3rem; }
    header .stats { color: var(--muted); font-size: .9rem; }
    header input { margin-left: auto; background: var(--card); border: 1px solid #2a2d36; color: var(--fg); padding: .5rem .8rem; border-radius: 8px; min-width: 220px; }
    .filters { padding: .6rem 1.5rem; display: flex; gap: .5rem; }
    .filters button { background: var(--card); border: 1px solid #2a2d36; color: var(--fg); padding: .35rem .8rem; border-radius: 999px; cursor: pointer; }
    .filters button.active { background: var(--accent); border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; padding: 1.5rem; }
    .card { background: var(--card); border-radius: 10px; overflow: hidden; }
    .poster { aspect-ratio: 2/3; background: #24262e center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .8rem; text-align: center; padding: .5rem; }
    .card .meta { padding: .5rem .6rem; }
    .card .name { font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .sub { color: var(--muted); font-size: .75rem; }
    .badge { display: inline-block; font-size: .65rem; padding: .1rem .4rem; border-radius: 4px; background: #3a2020; color: #ff9a9a; }
    .card .poster { cursor: pointer; }
    /* overlay détail */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; z-index: 20; overflow: auto; }
    .overlay.open { display: block; }
    .panel { max-width: 1100px; margin: 3rem auto; background: var(--bg); border: 1px solid #2a2d36; border-radius: 12px; padding: 1.5rem; }
    .panel h2 { margin: 0 0 .3rem; }
    .panel .close { float: right; background: var(--card); border: 1px solid #2a2d36; color: var(--fg); border-radius: 8px; padding: .3rem .7rem; cursor: pointer; }
    .cand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .8rem; margin-top: 1rem; }
    .cand { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid transparent; }
    .cand img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #24262e; }
    .cand .tag { position: absolute; top: 4px; left: 4px; font-size: .6rem; padding: .1rem .35rem; border-radius: 4px; background: rgba(0,0,0,.7); }
    .cand .tag.lang { right: 4px; left: auto; background: var(--accent); }
    /* vue liste collections */
    .col-list { padding: 1rem 1.5rem; }
    .col-row { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #2a2d36; align-items: flex-start; }
    .col-poster { width: 100px; flex-shrink: 0; aspect-ratio: 2/3; border-radius: 8px; background: #24262e center/cover no-repeat; cursor: pointer; display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.7rem;text-align:center }
    .col-main { flex: 1; min-width: 0; }
    .col-main h3 { margin: 0 0 .5rem; font-size: 1rem; }
    .col-members { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .5rem; }
    .col-members .m { width: 72px; flex-shrink: 0; cursor: pointer; }
    .col-members .m img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; background: #24262e; display:block }
    .col-members .m .mt { font-size: .65rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .2rem; }
  </style>
</head>
<body>
  <header>
    <h1>posterarr</h1>
    <span class="stats" id="stats">chargement…</span>
    <button id="heal-btn" onclick="runHeal()" style="background:var(--card);border:1px solid #2a2d36;color:var(--fg);padding:.5rem .9rem;border-radius:8px;cursor:pointer">🩹 Guérir</button>
    <button id="snapshot-btn" onclick="runSnapshot()" style="background:var(--card);border:1px solid #2a2d36;color:var(--fg);padding:.5rem .9rem;border-radius:8px;cursor:pointer">📸 Snapshot</button>
    <button id="autofill-btn" onclick="runAutofill()" style="background:var(--card);border:1px solid #2a2d36;color:var(--fg);padding:.5rem .9rem;border-radius:8px;cursor:pointer">⚡ Auto-remplir</button>
    <button id="view-btn" onclick="toggleView()" style="background:var(--card);border:1px solid #2a2d36;color:var(--fg);padding:.5rem .9rem;border-radius:8px;cursor:pointer"></button>
    <input id="search" placeholder="Rechercher…" />
  </header>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="col-list" id="collist" style="display:none"></div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <button class="close" onclick="closeDetail()">Fermer</button>
      <h2 id="d-name"></h2>
      <div class="sub" id="d-sub"></div>
      <div id="d-tabs" style="display:flex;gap:.4rem;margin-top:.7rem;flex-wrap:wrap"></div>
      <div id="d-identify" style="margin-top:.6rem"></div>
      <div id="d-zip" style="margin-top:.6rem"></div>
      <div id="d-lock" style="margin-top:.6rem"></div>
      <div id="d-current" style="margin-top:.7rem"></div>
      <div id="d-episodes" style="margin-top:.7rem"></div>
      <div id="dropzone" style="margin-top:.8rem;border:1px dashed #2a2d36;border-radius:8px;padding:.7rem;text-align:center;color:var(--muted);cursor:pointer;font-size:.85rem">
        📤 Glisse une image ici ou clique pour un poster custom
        <input type="file" id="file-input" accept="image/*" style="display:none" />
      </div>
      <div class="cand-grid" id="cand-grid"></div>
    </div>
  </div>

  <div class="overlay" id="cover-overlay">
    <div class="panel" style="max-width:900px">
      <button class="close" onclick="closeCover()">Fermer</button>
      <h2 id="cover-title">Créer une image</h2>
      <div class="sub" id="cover-sub"></div>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:.8rem">
        <div style="flex:0 0 auto">
          <canvas id="cover-canvas" style="max-width:340px;height:auto;border-radius:8px;background:#0d0f14"></canvas>
        </div>
        <div style="flex:1;min-width:240px;display:flex;flex-direction:column;gap:.6rem">
          <label class="sub">Titre<br><input id="cv-text" style="width:100%" placeholder="Ex. Films" oninput="drawCover()"/></label>
          <label class="sub">Fond<br>
            <select id="cv-bgmode" style="width:100%" onchange="onBgMode()">
              <option value="current">Image actuelle</option>
              <option value="upload">Fichier…</option>
              <option value="color">Couleur unie</option>
            </select>
          </label>
          <input type="file" id="cv-bgfile" accept="image/*" style="display:none" onchange="onBgFile()"/>
          <label class="sub">Couleur fond <input id="cv-bgcolor" type="color" value="#12141a" oninput="drawCover()"/></label>
          <label class="sub">Voile<br>
            <select id="cv-ovmode" style="width:100%" onchange="onOvMode()">
              <option value="uni">Uni</option>
              <option value="degrade">Dégradé</option>
            </select>
          </label>
          <label class="sub">Couleur voile <input id="cv-ovcolor" type="color" value="#000000" oninput="drawCover()"/> <span id="cv-dimv">45%</span><br><input id="cv-dim" type="range" min="0" max="100" value="45" style="width:100%" oninput="drawCover()"/></label>
          <div id="cv-grad" style="display:none;flex-direction:column;gap:.6rem">
            <label class="sub">Angle <span id="cv-anglev">0°</span><br><input id="cv-angle" type="range" min="0" max="360" value="0" style="width:100%" oninput="drawCover()"/></label>
            <label class="sub">Hauteur <span id="cv-ghv">60%</span><br><input id="cv-gheight" type="range" min="5" max="100" value="60" style="width:100%" oninput="drawCover()"/></label>
          </div>
          <label class="sub">Taille texte <span id="cv-fsv">12%</span><br><input id="cv-fs" type="range" min="4" max="24" value="12" style="width:100%" oninput="drawCover()"/></label>
          <label class="sub">Position <select id="cv-pos" style="width:100%" onchange="drawCover()"><option value="center">Centre</option><option value="bottom">Bas</option><option value="top">Haut</option></select></label>
          <label class="sub">Couleur texte <input id="cv-color" type="color" value="#ffffff" oninput="drawCover()"/></label>
          <div id="cover-msg" class="sub"></div>
          <button class="close" style="float:none;background:var(--accent);color:#fff" onclick="applyCover()">Appliquer</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TYPES = {
      Movie: "Films", Series: "Séries", Sport: "Sport", BoxSet: "Collections", libraries: "Bibliothèques",
      missing: "Sans poster", missingBackdrop: "Sans fond",
      missingLogo: "Sans logo", missingThumb: "Sans vignette",
      unlocked: "Déverrouillés",
    };
    // Filtre « manquant » -> type d'image à ouvrir dans le détail.
    const MISSING_TYPE = { missing: "Primary", missingBackdrop: "Backdrop", missingLogo: "Logo", missingThumb: "Thumb" };
    let items = [], filter = "Movie", q = "";
    // Normalise pour une recherche tolérante : sans accents, ponctuation → espace.
    const norm = (s) => (s || "").toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, " ").trim();

    let pendingScroll = null; // position de scroll à restaurer après un re-render async

    // Vue : "liste" (posters seuls) ou "ligne" (tous les types d'image par item).
    let viewMode = localStorage.getItem("posterarr.view") || "liste";
    function updateViewBtn() {
      const b = document.getElementById("view-btn");
      b.textContent = viewMode === "liste" ? "☰ Vue ligne" : "▦ Vue liste";
    }
    function toggleView() {
      viewMode = viewMode === "liste" ? "ligne" : "liste";
      localStorage.setItem("posterarr.view", viewMode);
      updateViewBtn();
      for (const k in groupCache) delete groupCache[k]; // rerender propre
      render();
    }
    // Bandeau des 4 types d'image d'un item, chacun cliquable vers son onglet.
    function imgStrip(images, id) {
      const T = [["Primary","Poster","2/3"],["Backdrop","Fond","16/9"],["Logo","Logo","16/9"],["Thumb","Vignette","16/9"]];
      return `<div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem">` + T.map(([t,label,ar]) => {
        const u = images && images[t];
        const box = u
          ? `<img loading="lazy" src="${u}" style="height:74px;aspect-ratio:${ar};object-fit:${t==="Primary"?"cover":"contain"};border-radius:6px;background:#0d0f14"/>`
          : `<div style="height:74px;aspect-ratio:${ar};display:flex;align-items:center;justify-content:center;border-radius:6px;background:#0d0f14;color:var(--muted);font-size:.7rem;min-width:52px">∅</div>`;
        return `<div onclick="openDetail('${id}','${t}')" style="cursor:pointer;text-align:center">${box}<div class="sub" style="font-size:.68rem">${label}</div></div>`;
      }).join("") + `</div>`;
    }

    async function load() {
      pendingScroll = window.scrollY; // préserve la position (le re-render ne remonte pas en haut)
      for (const k in groupCache) delete groupCache[k]; // invalide le cache (un poster a pu changer)
      const r = await fetch("/api/library");
      const d = await r.json();
      items = d.items;
      document.getElementById("stats").textContent =
        `${d.count} items · ${items.filter(i => !i.posterUrl).length} sans poster`;
      renderFilters();
      render();
    }

    function renderFilters() {
      const f = document.getElementById("filters");
      f.innerHTML = "";
      for (const [k, label] of Object.entries(TYPES)) {
        const b = document.createElement("button");
        b.textContent = label;
        b.className = k === filter ? "active" : "";
        b.onclick = () => { filter = k; renderFilters(); render(); };
        f.appendChild(b);
      }
    }

    function render() {
      const grid = document.getElementById("grid");
      const collist = document.getElementById("collist");
      // Vue liste dédiée pour les collections
      if (filter === "BoxSet" || filter === "Series" || filter === "Sport") {
        grid.style.display = "none";
        collist.style.display = "block";
        if (filter === "BoxSet") renderGroups("/api/collections", "film");
        else if (filter === "Sport") renderGroups("/api/sport", "saison");
        else renderGroups("/api/series", "saison");
        return;
      }
      if (filter === "libraries") {
        grid.style.display = "none";
        collist.style.display = "block";
        renderLibraries();
        return;
      }
      grid.style.display = "grid";
      collist.style.display = "none";
      const list = items.filter(i => {
        if (q && !norm(i.name).includes(q)) return false;
        // onglets « sans X » : items dépourvus de ce type d'image, tous types confondus
        if (filter === "missing") return !i.posterUrl;
        if (filter === "missingBackdrop") return !i.hasBackdrop;
        if (filter === "missingLogo") return !i.hasLogo;
        if (filter === "missingThumb") return !i.hasThumb;
        if (filter === "unlocked") return !i.locked;
        // onglet Films : masquer les films déjà dans une collection
        return i.type === filter && !(filter === "Movie" && i.inCollection);
      });
      grid.innerHTML = "";
      gridState = { list, shown: 0 };
      appendGridBatch();
      restoreScroll();
    }

    // Infinite scroll : rend la grille par lots, charge la suite quand la
    // sentinelle entre dans le viewport.
    const GRID_BATCH = 120;
    let gridState = { list: [], shown: 0 };
    let gridObserver = null;
    function appendGridBatch() {
      const grid = document.getElementById("grid");
      const openType = MISSING_TYPE[filter] ?? "Primary";
      const end = Math.min(gridState.shown + GRID_BATCH, gridState.list.length);
      const frag = document.createDocumentFragment();
      for (let n = gridState.shown; n < end; n++) {
        const i = gridState.list[n];
        const card = document.createElement("div");
        if (viewMode === "ligne") {
          card.className = "col-row";
          card.style.gridColumn = "1/-1";
          const poster = i.posterUrl
            ? `<div class="col-poster" style="background-image:url('${i.posterUrl}')" onclick="openDetail('${i.id}','Primary')"></div>`
            : `<div class="col-poster" onclick="openDetail('${i.id}','Primary')">pas de poster</div>`;
          card.innerHTML = `${poster}<div class="col-main">
            <h3>${i.name}${i.year ? ` <span class="sub" style="font-weight:400">${i.year}</span>` : ""}</h3>
            ${imgStrip(i.images, i.id)}
          </div>`;
        } else {
          card.className = "card";
          const poster = i.posterUrl
            ? `<div class="poster" style="background-image:url('${i.posterUrl}')" onclick="openDetail('${i.id}','${openType}')"></div>`
            : `<div class="poster" onclick="openDetail('${i.id}','${openType}')">pas de poster</div>`;
          card.innerHTML = `${poster}<div class="meta">
            <div class="name" title="${i.name}">${i.name}</div>
            <div class="sub">${i.year ?? ""} ${i.posterUrl ? "" : '<span class="badge">manquant</span>'}</div>
          </div>`;
        }
        frag.appendChild(card);
      }
      gridState.shown = end;
      // Retire l'ancienne sentinelle avant de rajouter le lot.
      const old = document.getElementById("grid-sentinel");
      if (old) old.remove();
      grid.appendChild(frag);
      if (gridState.shown < gridState.list.length) {
        const sentinel = document.createElement("div");
        sentinel.id = "grid-sentinel";
        sentinel.style.cssText = "grid-column:1/-1;height:1px";
        grid.appendChild(sentinel);
        if (!gridObserver) {
          gridObserver = new IntersectionObserver((entries) => {
            if (entries.some((e) => e.isIntersecting)) appendGridBatch();
          }, { rootMargin: "600px" });
        }
        gridObserver.observe(sentinel);
      }
    }

    function restoreScroll() {
      if (pendingScroll != null) { window.scrollTo(0, pendingScroll); pendingScroll = null; }
    }

    const groupCache = {};
    async function renderGroups(endpoint, memberLabel) {
      const el = document.getElementById("collist");
      if (!groupCache[endpoint]) {
        el.innerHTML = '<div style="color:var(--muted)">Chargement…</div>';
        const r = await fetch(endpoint);
        groupCache[endpoint] = (await r.json()).collections;
      }
      const list = groupCache[endpoint].filter(c => !q || norm(c.name).includes(q));
      el.innerHTML = "";
      if (!list.length) { el.innerHTML = '<div style="color:var(--muted)">Aucun résultat.</div>'; return; }

      if (viewMode === "liste") {
        // Grille de posters (couvertures) uniquement.
        const g = document.createElement("div");
        g.className = "grid";
        g.style.display = "grid";
        for (const c of list) {
          const card = document.createElement("div");
          card.className = "card";
          const poster = c.posterUrl
            ? `<div class="poster" style="background-image:url('${c.posterUrl}')" onclick="openDetail('${c.id}','Primary')"></div>`
            : `<div class="poster" onclick="openDetail('${c.id}','Primary')">pas de poster</div>`;
          card.innerHTML = `${poster}<div class="meta"><div class="name" title="${c.name}">${c.name}</div>
            <div class="sub">${c.year ?? ""} · ${c.members.length} ${memberLabel}(s)</div></div>`;
          g.appendChild(card);
        }
        el.appendChild(g);
        restoreScroll();
        return;
      }

      // Vue ligne : poster + bandeau des 4 types + membres (saisons/films).
      for (const c of list) {
        const row = document.createElement("div");
        row.className = "col-row";
        const poster = c.posterUrl
          ? `<div class="col-poster" style="background-image:url('${c.posterUrl}')" onclick="openDetail('${c.id}','Primary')"></div>`
          : `<div class="col-poster" onclick="openDetail('${c.id}','Primary')">pas de poster</div>`;
        const members = c.members.map(m => `
          <div class="m" onclick="openDetail('${m.id}')" title="${m.name}">
            ${m.posterUrl ? `<img loading="lazy" src="${m.posterUrl}" />` : '<div style="aspect-ratio:2/3;background:#24262e;border-radius:6px"></div>'}
            <div class="mt">${m.name}</div>
          </div>`).join("");
        row.innerHTML = `${poster}
          <div class="col-main">
            <h3>${c.name}${c.year ? ` <span class="sub" style="font-weight:400">${c.year}</span>` : ""} <span class="sub">· ${c.members.length} ${memberLabel}(s)</span></h3>
            ${imgStrip(c.images, c.id)}
            <div class="col-members" style="margin-top:.5rem">${members || `<span class="sub">Aucun ${memberLabel}</span>`}</div>
          </div>`;
        el.appendChild(row);
      }
      restoreScroll();
    }

    let current = null; // { id, managed, imageType }

    const IMAGE_TABS = [
      ["Primary", "Poster"], ["Backdrop", "Fond"], ["Logo", "Logo"],
      ["Thumb", "Vignette"], ["Banner", "Bannière"],
    ];

    function renderTabs() {
      const el = document.getElementById("d-tabs");
      el.innerHTML = IMAGE_TABS.map(([type, label]) => {
        const active = current.imageType === type;
        return `<button onclick="switchImageType('${type}')" class="close" style="float:none;${active
          ? "background:var(--accent);color:#fff"
          : ""}">${label}</button>`;
      }).join("");
    }

    function switchImageType(type) {
      if (current && current.imageType === type) return;
      openDetail(current.id, type);
    }

    async function openDetail(id, imageType = "Primary") {
      const ov = document.getElementById("overlay");
      ov.classList.add("open");
      document.getElementById("d-name").textContent = "Chargement des candidats…";
      document.getElementById("d-sub").textContent = "";
      document.getElementById("d-lock").innerHTML = "";
      document.getElementById("cand-grid").innerHTML = "";
      const r = await fetch(`/api/items/${id}/candidates?imageType=${imageType}`);
      const d = await r.json();
      current = { id, managed: d.managed, imageType };
      renderTabs();
      document.getElementById("d-name").textContent = d.item.name;
      document.getElementById("d-sub").textContent =
        `${d.count} candidats · sources : ${d.sources.join(", ") || "aucune"} · tmdb ${d.item.tmdbId ?? "—"}`;
      renderIdentify(d.item);
      renderZip(d.item);
      renderLock();
      renderCurrent(d.current);
      renderEpisodes(d.item);
      const g = document.getElementById("cand-grid");
      g.innerHTML = "";
      // Le poster est en portrait ; les autres types sont paysage/transparents.
      const isPrimary = current.imageType === "Primary";
      const ratio = isPrimary ? "2/3" : current.imageType === "Banner" ? "5.4/1" : "16/9";
      const fit = isPrimary ? "cover" : "contain";
      g.style.gridTemplateColumns = isPrimary ? "" : "repeat(auto-fill,minmax(220px,1fr))";
      if (!d.candidates.length) {
        g.innerHTML = '<div class="sub">Aucun candidat pour ce type d\'image.</div>';
      }
      for (const c of d.candidates.slice(0, 60)) {
        const el = document.createElement("div");
        el.className = "cand";
        const applied = current.managed && current.managed.source_url === c.url;
        el.innerHTML = `<img loading="lazy" src="${c.thumbUrl}" style="aspect-ratio:${ratio};object-fit:${fit}"
            onerror="this.onerror=null;this.removeAttribute('src');this.style.background='#0d0f14';this.dataset.err=1" />
          <span class="tag">${c.source}</span>
          ${c.lang ? `<span class="tag lang">${c.lang}</span>` : ""}
          ${applied ? '<span class="tag" style="bottom:4px;top:auto;background:#1e7a3a">appliqué</span>' : ""}`;
        el.style.cursor = "pointer";
        el.title = "Cliquer pour appliquer et verrouiller";
        el.onclick = () => apply(c);
        g.appendChild(el);
      }
    }

    function renderCurrent(cur) {
      const el = document.getElementById("d-current");
      const label = (IMAGE_TABS.find(t => t[0] === current.imageType) || [,"image"])[1];
      const createBtn = `<button class="close" style="float:none;margin-left:.6rem" onclick='openCover(${attrJson({kind:"item",id:current.id,imageType:current.imageType,name:document.getElementById("d-name").textContent})}, ${attrJson(cur?.url || null)})'>🎨 Créer</button>`;
      if (!cur) {
        el.innerHTML = `<span class="sub">Aucune image « ${label} » actuellement.</span>${createBtn}`;
        return;
      }
      const isPrimary = current.imageType === "Primary";
      const ratio = isPrimary ? "2/3" : current.imageType === "Banner" ? "5.4/1" : "16/9";
      const fit = isPrimary ? "cover" : "contain";

    function renderLock() {

    async function apply(c) {
      document.getElementById("d-lock").innerHTML = '<span class="sub">Application…</span>';

        method: "POST", headers: { "Content-Type": "application/json" },

    async function toggleLock() {

        method: "POST", headers: { "Content-Type": "application/json" },

    async function runHeal() {
      const btn = document.getElementById("heal-btn");
      const old = btn.textContent;
      btn.textContent = "🩹 Guérison…"; btn.disabled = true;
      try {
        const r = await fetch("/api/heal", { method: "POST" });
        const d = await r.json();
        if (d.error) { alert("Guérison : " + d.error); return; }
        const lines = [
          `${d.checked} item(s) verrouillé(s) vérifié(s)`,
          `${d.healed.length} poster(s) restauré(s)` + (d.healed.length ? " :\n" + d.healed.map(h => `  · ${h.name} (${h.reason === "missing" ? "disparu" : "remplacé"})`).join("\n") : ""),
          d.notFound.length ? `${d.notFound.length} introuvable(s) dans Jellyfin` : "",
          d.skippedNoSource.length
            ? `${d.skippedNoSource.length} disparu(s) sans source à réappliquer (verrouillés via Snapshot) :\n` +
              d.skippedNoSource.map(s => `  · ${s.name}`).join("\n")
            : "",

      } finally { btn.textContent = old; btn.disabled = false; }

    async function runSnapshot() {
      const btn = document.getElementById("snapshot-btn");
      const old = btn.textContent;
      btn.textContent = "📸 Snapshot…"; btn.disabled = true;
      try {
        const r = await fetch("/api/snapshot", { method: "POST" });
        const d = await r.json();

    // Devine titre + année depuis un nom de fichier pourri (pour préremplir la recherche).
    function guessTitleYear(name) {
      const ym = name.match(/\b(19|20)\d{2}\b/);
      const year = ym ? ym[0] : "";
      let title = ym ? name.slice(0, ym.index) : name;
      title = title.replace(/[[(].*$/, "").replace(/[._]/g, " ").trim();
      return { title, year };
    }

    let librariesCache = null;
    async function renderLibraries() {
      const el = document.getElementById("collist");

        el.innerHTML = '<div style="color:var(--muted)">Chargement…</div>';
        librariesCache = (await (await fetch("/api/libraries")).json()).libraries;

      // Dimensions Jellyfin par type d'image de bibliothèque.
      const LIB_DIM = { Primary: [682, 1024], Thumb: [1200, 700] };

        const [w, h] = LIB_DIM[type];
        const tgt = { kind: "library", id: l.id, imageType: type, name: l.name };

          ? `<img src="${img.url}" style="width:100%;aspect-ratio:${w}/${h};object-fit:cover;border-radius:6px;background:#0d0f14"/>`
          : `<div style="width:100%;aspect-ratio:${w}/${h};display:flex;align-items:center;justify-content:center;border-radius:6px;background:#0d0f14;color:var(--muted);font-size:.8rem">aucune</div>`;

          </div>

      };
      for (const l of list) {
        const row = document.createElement("div");

      }
      if (!list.length) el.innerHTML = '<div class="sub">Aucune bibliothèque.</div>';

    // --- Éditeur de cover (canvas) ---
    const TYPE_DIM = { Primary:[1000,1500], Backdrop:[1920,1080], Logo:[800,310], Thumb:[1000,562], Banner:[1000,185] };
    let cover = null; // { target, bgImg }

    // Échappe un JSON pour l'injecter dans un attribut HTML entre apostrophes.
    const attrJson = (v) => JSON.stringify(v).replace(/&/g, "&amp;").replace(/'/g, "&#39;");
    const hexA = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    };
    // Réglages de style persistés par type d'image (cohérence entre créations).
    const CV_KEYS = ["ovmode","ovcolor","dim","fs","pos","color","bgcolor","angle","gheight"];
    function saveCoverPreset(type) {
      const p = {};
      for (const k of CV_KEYS) p[k] = document.getElementById("cv-" + k).value;
      localStorage.setItem("posterarr.cover." + type, JSON.stringify(p));
    }
    function loadCoverPreset(type) {
      let p; try { p = JSON.parse(localStorage.getItem("posterarr.cover." + type) || "{}"); } catch { p = {}; }
      for (const k of CV_KEYS) if (p[k] != null) document.getElementById("cv-" + k).value = p[k];
    }
    function onOvMode() {
      document.getElementById("cv-grad").style.display =
        document.getElementById("cv-ovmode").value === "degrade" ? "flex" : "none";
      drawCover();
    }

    async function openCover(target, bgUrl, dims) {
      cover = { target, bgImg: null };
      const [w, h] = dims || TYPE_DIM[target.imageType] || TYPE_DIM.Primary;
      const cv = document.getElementById("cover-canvas");
      cv.width = w; cv.height = h;
      document.getElementById("cover-sub").textContent = `${target.name} · ${target.imageType} · ${w}×${h}`;
      document.getElementById("cv-text").value = target.name || "";
      document.getElementById("cover-msg").textContent = "";
      loadCoverPreset(target.imageType);
      document.getElementById("cv-grad").style.display =
        document.getElementById("cv-ovmode").value === "degrade" ? "flex" : "none";
      const mode = document.getElementById("cv-bgmode");
      mode.value = bgUrl ? "current" : "color";
      cover.currentUrl = bgUrl || null;
      document.getElementById("cover-overlay").classList.add("open");
      onBgMode();
    }
    function closeCover() { document.getElementById("cover-overlay").classList.remove("open"); cover = null; }

    async function delLibImage(id, type) {
      if (!confirm(`Supprimer l'image ${type} de cette bibliothèque ?`)) return;
      const r = await fetch(`/api/libraries/${id}/images/${type}`, { method: "DELETE" });
      const d = await r.json();
      if (d.error) { alert("Erreur : " + d.error); return; }
      librariesCache = null; renderLibraries();
    }

    function loadImg(src, proxied) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = proxied ? `/api/image-proxy?url=${encodeURIComponent(src)}` : src;
      });
    }

    async function onBgMode() {
      const mode = document.getElementById("cv-bgmode").value;
      document.getElementById("cv-bgfile").style.display = mode === "upload" ? "block" : "none";
      if (mode === "current" && cover.currentUrl) {
        try { cover.bgImg = await loadImg(cover.currentUrl, true); } catch { cover.bgImg = null; }
      } else if (mode !== "upload") {
        cover.bgImg = null;
      }
      drawCover();
    }
    async function onBgFile() {
      const f = document.getElementById("cv-bgfile").files[0];
      if (!f) return;
      try { cover.bgImg = await loadImg(URL.createObjectURL(f), false); } catch { cover.bgImg = null; }
      drawCover();
    }

    function drawCover() {
      if (!cover) return;
      const cv = document.getElementById("cover-canvas");
      const ctx = cv.getContext("2d");
      const W = cv.width, H = cv.height;
      ctx.clearRect(0, 0, W, H);
      if (cover.bgImg) {
        // cover-fit
        const ir = cover.bgImg.width / cover.bgImg.height, cr = W / H;
        let dw, dh;
        if (ir > cr) { dh = H; dw = H * ir; } else { dw = W; dh = W / ir; }
        ctx.drawImage(cover.bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
      } else {
        ctx.fillStyle = document.getElementById("cv-bgcolor").value;
        ctx.fillRect(0, 0, W, H);
      }
      const dim = +document.getElementById("cv-dim").value / 100;
      document.getElementById("cv-dimv").textContent = Math.round(dim * 100) + "%";
      const ovcolor = document.getElementById("cv-ovcolor").value;
      const ovmode = document.getElementById("cv-ovmode").value;
      if (dim > 0) {
        if (ovmode === "degrade") {
          const angle = +document.getElementById("cv-angle").value;
          const gh = +document.getElementById("cv-gheight").value / 100;
          document.getElementById("cv-anglev").textContent = angle + "°";
          document.getElementById("cv-ghv").textContent = Math.round(gh * 100) + "%";
          const rad = angle * Math.PI / 180, dx = Math.cos(rad), dy = Math.sin(rad);
          const len = Math.abs(dx) * W + Math.abs(dy) * H;
          const cx = W / 2, cy = H / 2;
          const g = ctx.createLinearGradient(cx - dx * len / 2, cy - dy * len / 2, cx + dx * len / 2, cy + dy * len / 2);
          g.addColorStop(0, hexA(ovcolor, dim));
          g.addColorStop(Math.min(1, gh), hexA(ovcolor, 0));
          g.addColorStop(1, hexA(ovcolor, 0));
          ctx.fillStyle = g;
        } else {
          ctx.fillStyle = hexA(ovcolor, dim);
        }
        ctx.fillRect(0, 0, W, H);
      }
      const text = document.getElementById("cv-text").value.trim();
      const fsPct = +document.getElementById("cv-fs").value;
      document.getElementById("cv-fsv").textContent = fsPct + "%";
      if (text) {
        const fs = Math.round(H * fsPct / 100);
        ctx.fillStyle = document.getElementById("cv-color").value;
        ctx.font = `700 ${fs}px system-ui, Arial, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = fs * 0.3;
        const pos = document.getElementById("cv-pos").value;
        const y = pos === "top" ? H * 0.18 : pos === "bottom" ? H * 0.85 : H / 2;
        // retour à la ligne simple si trop large
        const words = text.split(" "); const lines = []; let cur = "";
        for (const w of words) {
          const t = cur ? cur + " " + w : w;
          if (ctx.measureText(t).width > W * 0.9 && cur) { lines.push(cur); cur = w; } else cur = t;
        }
        if (cur) lines.push(cur);
        const lh = fs * 1.15;
        lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y + (i - (lines.length - 1) / 2) * lh));
        ctx.shadowBlur = 0;
      }
      if (cover.target) saveCoverPreset(cover.target.imageType);
    }

    async function applyCover() {
      if (!cover) return;
      const msg = document.getElementById("cover-msg");
      msg.textContent = "Application…";
      const cv = document.getElementById("cover-canvas");
      const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.92));
      if (!blob) { msg.textContent = "Erreur canvas (image protégée ?)"; return; }
      const fd = new FormData();
      fd.append("file", blob, "cover.jpg");
      fd.append("imageType", cover.target.imageType);
      const url = cover.target.kind === "library"
        ? `/api/libraries/${cover.target.id}/apply-file`
        : `/api/items/${cover.target.id}/apply-file`;
      try {
        const r = await fetch(url, { method: "POST", body: fd });
        const d = await r.json();
        if (d.error) { msg.textContent = "Erreur : " + d.error; return; }
        msg.textContent = "Appliqué ✅";
        if (cover.target.kind === "library") librariesCache = null;
        setTimeout(() => { closeCover(); load(); }, 500);
      } catch (e) { msg.textContent = "Erreur : " + e; }
    }

    document.getElementById("search").oninput = (e) => { q = norm(e.target.value); render(); };
    updateViewBtn();
    load();
  </script>
</body>
</html>
