<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>posterarr</title>
  <style>
    :root { color-scheme: light dark; --bg: #0e0f13; --card: #1a1c22; --fg: #e8e8ea; --muted: #8a8d97; --accent: #6279cd; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid #2a2d36; display: flex; gap: 1rem; align-items: baseline; position: sticky; top: 0; background: var(--bg); z-index: 10; }
    header h1 { margin: 0; font-size: 1.3rem; }
    header .stats { color: var(--muted); font-size: .9rem; }
    header input { margin-left: auto; background: var(--card); border: 1px solid #2a2d36; color: var(--fg); padding: .5rem .8rem; border-radius: 8px; min-width: 220px; }
    .filters { padding: .6rem 1.5rem; display: flex; gap: .5rem; }
    .filters button { background: var(--card); border: 1px solid #2a2d36; color: var(--fg); padding: .35rem .8rem; border-radius: 999px; cursor: pointer; }
    .filters button.active { background: var(--accent); border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; padding: 1.5rem; }
    .card { background: var(--card); border-radius: 10px; overflow: hidden; }
    .poster { aspect-ratio: 2/3; background: #24262e center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .8rem; text-align: center; padding: .5rem; }
    .card .meta { padding: .5rem .6rem; }
    .card .name { font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .sub { color: var(--muted); font-size: .75rem; }
    .badge { display: inline-block; font-size: .65rem; padding: .1rem .4rem; border-radius: 4px; background: #3a2020; color: #ff9a9a; }
    .card .poster { cursor: pointer; }
    /* overlay détail */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; z-index: 20; overflow: auto; }
    .overlay.open { display: block; }
    .panel { max-width: 1100px; margin: 3rem auto; background: var(--bg); border: 1px solid #2a2d36; border-radius: 12px; padding: 1.5rem; }
    .panel h2 { margin: 0 0 .3rem; }
    .panel .close { float: right; background: var(--card); border: 1px solid #2a2d36; color: var(--fg); border-radius: 8px; padding: .3rem .7rem; cursor: pointer; }
    .cand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .8rem; margin-top: 1rem; }
    .cand { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid transparent; }
    .cand img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #24262e; }
    .cand .tag { position: absolute; top: 4px; left: 4px; font-size: .6rem; padding: .1rem .35rem; border-radius: 4px; background: rgba(0,0,0,.7); }
    .cand .tag.lang { right: 4px; left: auto; background: var(--accent); }
    /* vue liste collections */
    .col-list { padding: 1rem 1.5rem; }
    .col-row { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #2a2d36; align-items: flex-start; }
    .col-poster { width: 100px; flex-shrink: 0; aspect-ratio: 2/3; border-radius: 8px; background: #24262e center/cover no-repeat; cursor: pointer; display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.7rem;text-align:center }
    .col-main { flex: 1; min-width: 0; }
    .col-main h3 { margin: 0 0 .5rem; font-size: 1rem; }
    .col-members { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .5rem; }
    .col-members .m { width: 72px; flex-shrink: 0; cursor: pointer; }
    .col-members .m img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; background: #24262e; display:block }
    .col-members .m .mt { font-size: .65rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .2rem; }
  </style>
</head>
<body>
  <header>
    <h1>posterarr</h1>
    <span class="stats" id="stats">chargement…</span>
    <button id="heal-btn" onclick="runHeal()" style="background:var(--card);border:1px solid #2a2d36;color:var(--fg);padding:.5rem .9rem;border-radius:8px;cursor:pointer">🩹 Guérir</button>
    <button id="snapshot-btn" onclick="runSnapshot()" style="background:var(--card);border:1px solid #2a2d36;color:var(--fg);padding:.5rem .9rem;border-radius:8px;cursor:pointer">📸 Snapshot</button>
    <input id="search" placeholder="Rechercher…" />
  </header>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="col-list" id="collist" style="display:none"></div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <button class="close" onclick="closeDetail()">Fermer</button>
      <h2 id="d-name"></h2>
      <div class="sub" id="d-sub"></div>
      <div id="d-tabs" style="display:flex;gap:.4rem;margin-top:.7rem;flex-wrap:wrap"></div>
      <div id="d-identify" style="margin-top:.6rem"></div>
      <div id="d-zip" style="margin-top:.6rem"></div>
      <div id="d-lock" style="margin-top:.6rem"></div>
      <div id="d-current" style="margin-top:.7rem"></div>
      <div id="dropzone" style="margin-top:.8rem;border:1px dashed #2a2d36;border-radius:8px;padding:.7rem;text-align:center;color:var(--muted);cursor:pointer;font-size:.85rem">
        📤 Glisse une image ici ou clique pour un poster custom
        <input type="file" id="file-input" accept="image/*" style="display:none" />
      </div>
      <div class="cand-grid" id="cand-grid"></div>
    </div>
  </div>

  <script>
    const TYPES = { Movie: "Films", Series: "Séries", BoxSet: "Collections", missing: "Sans poster" };
    let items = [], filter = "Movie", q = "";

    let pendingScroll = null; // position de scroll à restaurer après un re-render async

    async function load() {
      pendingScroll = window.scrollY; // préserve la position (le re-render ne remonte pas en haut)
      for (const k in groupCache) delete groupCache[k]; // invalide le cache (un poster a pu changer)
      const r = await fetch("/api/library");
      const d = await r.json();
      items = d.items;
      document.getElementById("stats").textContent =
        `${d.count} items · ${items.filter(i => !i.posterUrl).length} sans poster`;
      renderFilters();
      render();
    }

    function renderFilters() {
      const f = document.getElementById("filters");
      f.innerHTML = "";
      for (const [k, label] of Object.entries(TYPES)) {
        const b = document.createElement("button");
        b.textContent = label;
        b.className = k === filter ? "active" : "";
        b.onclick = () => { filter = k; renderFilters(); render(); };
        f.appendChild(b);
      }
    }

    function render() {
      const grid = document.getElementById("grid");
      const collist = document.getElementById("collist");
      // Vue liste dédiée pour les collections
      if (filter === "BoxSet" || filter === "Series") {
        grid.style.display = "none";
        collist.style.display = "block";
        if (filter === "BoxSet") renderGroups("/api/collections", "film");
        else renderGroups("/api/series", "saison");
        return;
      }
      grid.style.display = "grid";
      collist.style.display = "none";
      const list = items.filter(i => {
        if (q && !i.name.toLowerCase().includes(q)) return false;
        // onglet Sans poster : tout ce qui n'a pas de visuel, tous types confondus
        if (filter === "missing") return !i.posterUrl;
        // onglet Films : masquer les films déjà dans une collection
        return i.type === filter && !(filter === "Movie" && i.inCollection);
      });
      grid.innerHTML = "";
      for (const i of list.slice(0, 300)) {
        const card = document.createElement("div");
        card.className = "card";
        const poster = i.posterUrl
          ? `<div class="poster" style="background-image:url('${i.posterUrl}')" onclick="openDetail('${i.id}')"></div>`
          : `<div class="poster" onclick="openDetail('${i.id}')">pas de poster</div>`;
        card.innerHTML = `${poster}<div class="meta">
          <div class="name" title="${i.name}">${i.name}</div>
          <div class="sub">${i.year ?? ""} ${i.posterUrl ? "" : '<span class="badge">manquant</span>'}</div>
        </div>`;
        grid.appendChild(card);
      }
      if (list.length > 300) {
        const note = document.createElement("div");
        note.style.cssText = "grid-column:1/-1;color:var(--muted);text-align:center";
        note.textContent = `… ${list.length - 300} de plus (pagination à venir)`;
        grid.appendChild(note);
      }
      restoreScroll();
    }

    function restoreScroll() {
      if (pendingScroll != null) { window.scrollTo(0, pendingScroll); pendingScroll = null; }
    }

    const groupCache = {};
    async function renderGroups(endpoint, memberLabel) {
      const el = document.getElementById("collist");
      if (!groupCache[endpoint]) {
        el.innerHTML = '<div style="color:var(--muted)">Chargement…</div>';
        const r = await fetch(endpoint);
        groupCache[endpoint] = (await r.json()).collections;
      }
      const list = groupCache[endpoint].filter(c => !q || c.name.toLowerCase().includes(q));
      el.innerHTML = "";
      for (const c of list) {
        const row = document.createElement("div");
        row.className = "col-row";
        const poster = c.posterUrl
          ? `<div class="col-poster" style="background-image:url('${c.posterUrl}')" onclick="openDetail('${c.id}')"></div>`
          : `<div class="col-poster" onclick="openDetail('${c.id}')">pas de poster</div>`;
        const members = c.members.map(m => `
          <div class="m" onclick="openDetail('${m.id}')" title="${m.name}">
            ${m.posterUrl ? `<img loading="lazy" src="${m.posterUrl}" />` : '<div style="aspect-ratio:2/3;background:#24262e;border-radius:6px"></div>'}
            <div class="mt">${m.name}</div>
          </div>`).join("");
        row.innerHTML = `${poster}
          <div class="col-main">
            <h3>${c.name}${c.year ? ` <span class="sub" style="font-weight:400">${c.year}</span>` : ""} <span class="sub">· ${c.members.length} ${memberLabel}(s)</span></h3>
            <div class="col-members">${members || `<span class="sub">Aucun ${memberLabel}</span>`}</div>
          </div>`;
        el.appendChild(row);
      }
      if (!list.length) el.innerHTML = '<div style="color:var(--muted)">Aucun résultat.</div>';
      restoreScroll();
    }

    let current = null; // { id, managed, imageType }

    const IMAGE_TABS = [
      ["Primary", "Poster"], ["Backdrop", "Fond"], ["Logo", "Logo"],
      ["Thumb", "Vignette"], ["Banner", "Bannière"],
    ];

    function renderTabs() {
      const el = document.getElementById("d-tabs");
      el.innerHTML = IMAGE_TABS.map(([type, label]) => {
        const active = current.imageType === type;
        return `<button onclick="switchImageType('${type}')" class="close" style="float:none;${active
          ? "background:var(--accent);color:#fff"
          : ""}">${label}</button>`;
      }).join("");
    }

    function switchImageType(type) {
      if (current && current.imageType === type) return;
      openDetail(current.id, type);
    }

    async function openDetail(id, imageType = "Primary") {
      const ov = document.getElementById("overlay");
      ov.classList.add("open");
      document.getElementById("d-name").textContent = "Chargement des candidats…";
      document.getElementById("d-sub").textContent = "";
      document.getElementById("d-lock").innerHTML = "";
      document.getElementById("cand-grid").innerHTML = "";
      const r = await fetch(`/api/items/${id}/candidates?imageType=${imageType}`);
      const d = await r.json();
      current = { id, managed: d.managed, imageType };
      renderTabs();
      document.getElementById("d-name").textContent = d.item.name;
      document.getElementById("d-sub").textContent =
        `${d.count} candidats · sources : ${d.sources.join(", ") || "aucune"} · tmdb ${d.item.tmdbId ?? "—"}`;
      renderIdentify(d.item);
      renderZip(d.item);
      renderLock();
      renderCurrent(d.current);
      const g = document.getElementById("cand-grid");
      g.innerHTML = "";
      // Le poster est en portrait ; les autres types sont paysage/transparents.
      const isPrimary = current.imageType === "Primary";
      const ratio = isPrimary ? "2/3" : current.imageType === "Banner" ? "5.4/1" : "16/9";
      const fit = isPrimary ? "cover" : "contain";
      g.style.gridTemplateColumns = isPrimary ? "" : "repeat(auto-fill,minmax(220px,1fr))";
      if (!d.candidates.length) {
        g.innerHTML = '<div class="sub">Aucun candidat pour ce type d\'image.</div>';
      }
      for (const c of d.candidates.slice(0, 60)) {
        const el = document.createElement("div");
        el.className = "cand";
        const applied = current.managed && current.managed.source_url === c.url;
        el.innerHTML = `<img loading="lazy" src="${c.thumbUrl}" style="aspect-ratio:${ratio};object-fit:${fit}" />
          <span class="tag">${c.source}</span>
          ${c.lang ? `<span class="tag lang">${c.lang}</span>` : ""}
          ${applied ? '<span class="tag" style="bottom:4px;top:auto;background:#1e7a3a">appliqué</span>' : ""}`;
        el.style.cursor = "pointer";
        el.title = "Cliquer pour appliquer et verrouiller";
        el.onclick = () => apply(c);
        g.appendChild(el);
      }
    }

    function renderCurrent(cur) {
      const el = document.getElementById("d-current");
      const label = (IMAGE_TABS.find(t => t[0] === current.imageType) || [,"image"])[1];
      if (!cur) {
        el.innerHTML = `<span class="sub">Aucune image « ${label} » actuellement.</span>`;
        return;
      }
      const isPrimary = current.imageType === "Primary";
      const ratio = isPrimary ? "2/3" : current.imageType === "Banner" ? "5.4/1" : "16/9";
      const fit = isPrimary ? "cover" : "contain";
      el.innerHTML = `<div class="sub" style="margin-bottom:.35rem">Image « ${label} » actuelle :</div>
        <img src="${cur.url}" style="max-height:140px;aspect-ratio:${ratio};object-fit:${fit};border-radius:6px;background:#0d0f14" />`;
    }

    function renderLock() {
      const el = document.getElementById("d-lock");
      const m = current.managed;
      if (!m) { el.innerHTML = '<span class="sub">Non géré — clique un poster pour l\'appliquer.</span>'; return; }
      const locked = m.locked === 1;
      el.innerHTML = `<span class="badge" style="background:${locked ? '#1e3a5f' : '#3a3320'};color:${locked ? '#9ac4ff' : '#ffd98a'}">
        ${locked ? '🔒 verrouillé' : '🔓 déverrouillé'}</span>
        <button class="close" style="float:none;margin-left:.6rem" onclick="toggleLock()">${locked ? 'Déverrouiller' : 'Verrouiller'}</button>
        <span class="sub" style="margin-left:.6rem">source : ${m.source}</span>`;
    }

    async function apply(c) {
      document.getElementById("d-lock").innerHTML = '<span class="sub">Application…</span>';
      const r = await fetch(`/api/items/${current.id}/apply`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: c.url, source: c.source, imageType: current.imageType }),
      });
      const d = await r.json();
      if (d.ok) { current.managed = d.managed; openDetail(current.id, current.imageType); load(); }
      else alert("Échec : " + (d.error || "inconnu"));
    }

    async function toggleLock() {
      const locked = !(current.managed && current.managed.locked === 1);
      const r = await fetch(`/api/items/${current.id}/lock`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ locked, imageType: current.imageType }),
      });
      const d = await r.json();
      if (d.ok) { current.managed = d.managed; renderLock(); }
      else alert("Échec : " + (d.error || "inconnu"));
    }

    async function runHeal() {
      const btn = document.getElementById("heal-btn");
      const old = btn.textContent;
      btn.textContent = "🩹 Guérison…"; btn.disabled = true;
      try {
        const r = await fetch("/api/heal", { method: "POST" });
        const d = await r.json();
        if (d.error) { alert("Guérison : " + d.error); return; }
        const lines = [
          `${d.checked} item(s) verrouillé(s) vérifié(s)`,
          `${d.healed.length} poster(s) restauré(s)` + (d.healed.length ? " :\n" + d.healed.map(h => `  · ${h.name} (${h.reason === "missing" ? "disparu" : "remplacé"})`).join("\n") : ""),
          d.notFound.length ? `${d.notFound.length} introuvable(s) dans Jellyfin` : "",
          d.errors.length ? `${d.errors.length} erreur(s)` : "",
        ].filter(Boolean);
        alert("Guérison terminée\n\n" + lines.join("\n"));
        if (d.healed.length) load();
      } finally { btn.textContent = old; btn.disabled = false; }
    }

    async function runSnapshot() {
      const btn = document.getElementById("snapshot-btn");
      const old = btn.textContent;
      btn.textContent = "📸 Snapshot…"; btn.disabled = true;
      try {
        const r = await fetch("/api/snapshot", { method: "POST" });
        const d = await r.json();
        if (d.error) { alert("Snapshot : " + d.error); return; }
        alert("Snapshot terminé\n\n" + [
          `${d.scanned} item(s) scanné(s)`,
          `${d.recorded} enregistré(s)`,
          `${d.skippedExisting} déjà géré(s)`,
          `${d.skippedNoImage} sans image`,
          `${d.skippedNoKey} sans id stable (collections/saisons)`,
        ].join("\n"));
        if (d.recorded) load();
      } finally { btn.textContent = old; btn.disabled = false; }
    }

    // Devine titre + année depuis un nom de fichier pourri (pour préremplir la recherche).
    function guessTitleYear(name) {
      const ym = name.match(/\b(19|20)\d{2}\b/);
      const year = ym ? ym[0] : "";
      let title = ym ? name.slice(0, ym.index) : name;
      title = title.replace(/[[(].*$/, "").replace(/[._]/g, " ").trim();
      return { title, year };
    }

    function renderIdentify(item) {
      const el = document.getElementById("d-identify");
      if (item.tmdbId) { el.innerHTML = ""; return; } // déjà identifié
      const g = guessTitleYear(item.name);
      el.innerHTML = `
        <div style="background:#3a2a1a;border:1px solid #5f4420;border-radius:8px;padding:.7rem">
          <strong>⚠️ Non identifié</strong> — pas de TMDB id, aucun candidat possible. Cherche le bon film/série :
          <div style="display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap">
            <input id="tmdb-q" value="${g.title.replace(/"/g, "&quot;")}" placeholder="Titre" style="flex:1;min-width:160px;background:var(--card);border:1px solid #2a2d36;color:var(--fg);padding:.4rem .6rem;border-radius:6px" />
            <input id="tmdb-y" value="${g.year}" placeholder="Année" style="width:80px;background:var(--card);border:1px solid #2a2d36;color:var(--fg);padding:.4rem .6rem;border-radius:6px" />
            <button class="close" style="float:none" onclick="searchTmdb('${item.type}')">Chercher</button>
          </div>
          <div id="tmdb-results" class="cand-grid" style="margin-top:.6rem"></div>
        </div>`;
    }

    async function searchTmdb(type) {
      const q = document.getElementById("tmdb-q").value;
      const y = document.getElementById("tmdb-y").value;
      const box = document.getElementById("tmdb-results");
      box.innerHTML = '<span class="sub">Recherche…</span>';
      const r = await fetch(`/api/tmdb/search?type=${type}&query=${encodeURIComponent(q)}&year=${encodeURIComponent(y)}`);
      const d = await r.json();
      box.innerHTML = "";
      if (!d.results.length) { box.innerHTML = '<span class="sub">Aucun résultat.</span>'; return; }
      for (const m of d.results) {
        const el = document.createElement("div");
        el.className = "cand"; el.style.cursor = "pointer";
        el.title = `Associer : ${m.title} (${m.year ?? "?"}) — tmdb ${m.tmdbId}`;
        el.innerHTML = `${m.posterUrl ? `<img loading="lazy" src="${m.posterUrl}" />` : '<div class="poster">?</div>'}
          <div class="meta"><div class="name">${m.title}</div><div class="sub">${m.year ?? ""}</div></div>`;
        el.onclick = () => setTmdb(m);
        box.appendChild(el);
      }
    }

    async function setTmdb(m) {
      document.getElementById("d-identify").innerHTML = '<span class="sub">Association + refresh Jellyfin…</span>';
      const r = await fetch(`/api/items/${current.id}/set-tmdb`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tmdbId: m.tmdbId }),
      });
      const d = await r.json();
      if (d.ok) { setTimeout(() => { openDetail(current.id, current.imageType); load(); }, 1500); }
      else alert("Échec : " + (d.error || "inconnu"));
    }

    function renderZip(item) {
      const el = document.getElementById("d-zip");
      if (item.type !== "BoxSet" && item.type !== "Series") { el.innerHTML = ""; return; }
      const isSeries = item.type === "Series";
      const label = isSeries
        ? "📦 Glisse un zip ThePosterDB (set de série) — applique le poster de série + ceux des saisons (match par numéro)"
        : "📦 Glisse un zip ThePosterDB (set de collection) — applique le poster de collection + ceux des films (match par année)";
      el.innerHTML = `
        <div id="zipzone" data-series="${isSeries}" style="border:1px dashed #2a2d36;border-radius:8px;padding:.7rem;text-align:center;color:var(--muted);cursor:pointer;font-size:.85rem">
          ${label}
          <input type="file" id="zip-input" accept=".zip" style="display:none" />
        </div>`;
      const zz = document.getElementById("zipzone");
      const zi = document.getElementById("zip-input");
      zz.onclick = () => zi.click();
      zi.onchange = () => uploadZip(zi.files[0]);
      zz.ondragover = (e) => { e.preventDefault(); zz.style.borderColor = "var(--accent)"; };
      zz.ondragleave = () => { zz.style.borderColor = "#2a2d36"; };
      zz.ondrop = (e) => { e.preventDefault(); zz.style.borderColor = "#2a2d36"; uploadZip(e.dataTransfer.files[0]); };
    }

    async function uploadZip(file) {
      if (!file || !current) return;
      const isSeries = document.getElementById("zipzone")?.dataset.series === "true";
      const fd = new FormData();
      fd.append("file", file);
      document.getElementById("d-zip").innerHTML = '<span class="sub">Application du set…</span>';
      const endpoint = isSeries ? `/api/series/${current.id}/apply-zip` : `/api/collections/${current.id}/apply-zip`;
      const r = await fetch(endpoint, { method: "POST", body: fd });
      const d = await r.json();
      if (!d.ok) { alert("Échec : " + (d.error || "inconnu")); return; }
      const lines = d.applied.map(a => `  · ${a.target} ← ${a.file}`).join("\n");
      alert(`Set appliqué : ${d.applied.length} poster(s)\n${lines}` +
        (d.unmatched.length ? `\n\nNon matchés :\n${d.unmatched.map(f => "  · " + f).join("\n")}` : ""));
      openDetail(current.id, current.imageType); load();
    }

    async function uploadCustom(file) {
      if (!file || !current) return;
      const fd = new FormData();
      fd.append("file", file);
      fd.append("imageType", current.imageType);
      document.getElementById("d-lock").innerHTML = '<span class="sub">Upload custom…</span>';
      const r = await fetch(`/api/items/${current.id}/apply-file`, { method: "POST", body: fd });
      const d = await r.json();
      if (d.ok) { current.managed = d.managed; openDetail(current.id, current.imageType); load(); }
      else alert("Échec upload : " + (d.error || "inconnu"));
    }
    (function wireDropzone() {
      const dz = document.getElementById("dropzone");
      const inp = document.getElementById("file-input");
      dz.onclick = () => inp.click();
      inp.onchange = () => uploadCustom(inp.files[0]);
      dz.ondragover = (e) => { e.preventDefault(); dz.style.borderColor = "var(--accent)"; };
      dz.ondragleave = () => { dz.style.borderColor = "#2a2d36"; };
      dz.ondrop = (e) => { e.preventDefault(); dz.style.borderColor = "#2a2d36"; uploadCustom(e.dataTransfer.files[0]); };
    })();

    function closeDetail() { document.getElementById("overlay").classList.remove("open"); }
    document.getElementById("overlay").onclick = (e) => { if (e.target.id === "overlay") closeDetail(); };

    document.getElementById("search").oninput = (e) => { q = e.target.value.toLowerCase(); render(); };
    load();
  </script>
</body>
</html>
